<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone 11 Pro — Through the Lens</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="scroll-driver">

  <!-- Sticky stage -->
  <div class="stage">

    <!-- Scroll-scrubbed video -->
    <video class="stage__video" id="heroVideo"
      src="assets/hero.mp4"
      muted playsinline preload="auto"
      aria-hidden="true"></video>

    <!-- Lens mask: circular crop that grows as you scroll -->
    <div class="lens-mask" id="lensMask">
      <svg class="lens-mask__svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <mask id="circleMask">
            <rect width="100" height="100" fill="black"/>
            <circle id="lensCircle" cx="50" cy="50" r="0" fill="white"/>
          </mask>
        </defs>
        <rect width="100" height="100" fill="#000" mask="url(#circleMask)"/>
      </svg>
    </div>

    <!-- Lock-up text — fades out as lens opens -->
    <div class="lockup" id="lockup">
      <p class="lockup__super">iPhone 11 Pro</p>
      <h1 class="lockup__headline">A camera that<br>captures life's<br>every detail.</h1>
    </div>

    <!-- Scroll hint -->
    <div class="scroll-hint" id="scrollHint">
      <span>Scroll</span>
      <div class="scroll-hint__line"></div>
    </div>

  </div><!-- /stage -->

</div><!-- /scroll-driver -->

<!-- Content revealed after lens opens fully -->
<section class="reveal-content">
  <div class="reveal-content__inner">
    <p class="reveal-content__eyebrow">Pro camera system</p>
    <h2 class="reveal-content__h2">Three cameras.<br>One extraordinary shot.</h2>
    <p class="reveal-content__body">Ultra Wide. Wide. Telephoto. The first triple-camera system on iPhone, working together to capture extraordinary detail from every angle.</p>
  </div>
</section>

<script src="main.js"></script>
</body>
</html>
